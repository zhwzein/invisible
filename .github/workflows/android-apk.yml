name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Auto-bump Android version from CI run number
        run: node scripts/bump-version.js --ci-run ${{ github.run_number }}

      - name: Build web assets & sync Capacitor Android
        run: |
          node scripts/build-web.js
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invisible-android-apk-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Invisible-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Invisible v1.0.${{ github.run_number }}
          files: Invisible-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
